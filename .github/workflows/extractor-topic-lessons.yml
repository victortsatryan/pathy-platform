name: Pathy tests, TypeScript and production build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pathy-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly the locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Run Pathy extractor integration tests
        run: npx vitest run --config vitest.extractor.config.ts
      - name: Check lesson security and transaction in PGlite
        run: |
          npx vitest run tests/security-pathy-lesson.test.ts
          node tests/security-sql-pglite.mjs
          node tests/atomic-lesson-pglite.mjs
          node tests/lesson-real-schema-pglite.mjs
          node tests/ext02-batch-pglite.mjs
          node tests/community-author-status-pglite.mjs
      - name: Generate routes with the declared TanStack CLI
        run: npx tsr generate
      - name: Typecheck all application code
        run: npx tsc -b --noEmit
      - name: Build production application
        run: npm run build
